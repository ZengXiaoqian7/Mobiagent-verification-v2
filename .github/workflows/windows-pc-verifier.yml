name: Windows PC Verifier

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pc-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-lock.txt

      - name: Install locked CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci-lock.txt

      - name: Run PC verifier acceptance
        shell: powershell
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONNOUSERSITE: "1"
          PYTEST_ADDOPTS: "--tb=long --showlocals --junitxml=output_pc_acceptance/pytest-junit.xml"
        run: .\verify_pc_release.ps1 -SkipRealReplay

      - name: Upload PC verifier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MobiAgentVerifierDiagnostics-${{ github.run_id }}
          path: |
            output_pc_acceptance/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload manually requested PC build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MobiAgentVerifierPC-${{ github.sha }}
          path: |
            dist/MobiAgentVerifierPC/
            output_pc_acceptance/acceptance_summary.json
            output_pc_acceptance/packaged_mock/report.md
          if-no-files-found: error
          retention-days: 14
